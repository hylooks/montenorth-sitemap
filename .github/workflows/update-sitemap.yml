name: Update sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest sitemap
        run: |
          curl -fL \
            "https://jgcrjdemvpyrnmueynia.supabase.co/functions/v1/hello-world" \
            -o sitemap.xml

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "Sitemap tidak berubah."
          else
            git commit -m "Update sitemap"
            git push
          fi
