<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Monte North Foundation Forum</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 440px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Create Account</h1>

    <p class="subtitle">
      Join the Monte North Foundation Forum
    </p>

    <form id="registerForm">

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        required
        minlength="3"
        maxlength="30"
        autocomplete="username"
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        required
        minlength="6"
        autocomplete="new-password"
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://jgcrjdemvpyrnmueynia.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_eTzSlEx85-dU_dPExo-jlQ_2y5pndYe";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "Creating account...";

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              username: username
            }
          }
        });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.innerHTML =
        "Account created successfully.<br>" +
        "Please check your email if email confirmation is enabled.";

      form.reset();
    });
  </script>

</body>
</html>
