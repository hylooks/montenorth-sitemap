<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte North Foundation | Together for a Brighter Tomorrow</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}
nav{margin-bottom:30px} nav a{margin-right:15px}
.thread,.reply{border:1px solid #ddd;border-radius:8px;padding:18px;margin:15px 0}
.meta{color:#666;font-size:.9em}
.content{white-space:pre-wrap;word-wrap:break-word}
textarea{width:100%;box-sizing:border-box;min-height:160px;padding:10px}
button{padding:10px 16px;cursor:pointer}
#message{margin-top:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function updateThreadSEO(title, description) {
    const cleanTitle = String(title || "Thread").trim();
    const cleanDescription = String(description || "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 160);

    document.title =
        cleanTitle +
        " - Monte North Foundation | Together for a Brighter Tomorrow";

    let meta = document.querySelector('meta[name="description"]');

    if (!meta) {
        meta = document.createElement("meta");
        meta.name = "description";
        document.head.appendChild(meta);
    }

    meta.content = cleanDescription ||
        "Join the Monte North Foundation community and discuss ideas for a brighter tomorrow.";
}
</script>
</head>
<body>
<nav>
<a href="index.html">Forum</a>
<a href="create-thread.html">Create a Thread</a>
<a href="login.html">Login</a>
<a href="register.html">Register</a>
</nav>

<div id="thread">Loading thread...</div>
<div id="replies"></div>
<div id="replyBox"></div>
<div id="message"></div>

<script>
const SUPABASE_URL = "https://jgcrjdemvpyrnmueynia.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_eTzSlEx85-dU_dPExo-jlQ_2y5pndYe";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const params = new URLSearchParams(window.location.search);
const threadId = params.get("id");
const threadEl = document.getElementById("thread");
const repliesEl = document.getElementById("replies");
const replyBox = document.getElementById("replyBox");
const message = document.getElementById("message");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function renderContent(value) {
  let s = escapeHtml(value);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/gi,
    '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s;
}

async function load() {
  if (!threadId) {
    threadEl.textContent = "Invalid thread.";
    return;
  }

  const { data: thread, error: threadError } = await supabaseClient
    .from("threads")
    .select("id,title,content,created_at,profiles(username)")
    .eq("id", threadId)
    .single();

  if (threadError) {
    threadEl.textContent = threadError.message;
    return;
  }

  // Dynamic SEO: browser title uses the thread title; H1 below remains only the thread title.
  updateThreadSEO(thread.title, thread.content);

  threadEl.innerHTML =
    '<div class="thread">' +
    '<h1>' + escapeHtml(thread.title) + '</h1>' +
    '<div class="meta">By ' + escapeHtml(thread.profiles?.username || "User") +
    ' Â· ' + new Date(thread.created_at).toLocaleString() + '</div>' +
    '<div class="content">' + renderContent(thread.content) + '</div>' +
    '</div>';

  const { data: replies, error: repliesError } = await supabaseClient
    .from("replies")
    .select("id,content,created_at,profiles(username)")
    .eq("thread_id", Number(threadId))
    .order("created_at", { ascending: true });

  if (repliesError) {
    repliesEl.textContent = repliesError.message;
    return;
  }

  repliesEl.innerHTML = "<h2>Replies</h2>" +
    (replies.length ? replies.map(r =>
      '<div class="reply">' +
      '<div class="meta">' + escapeHtml(r.profiles?.username || "User") +
      ' Â· ' + new Date(r.created_at).toLocaleString() + '</div>' +
      '<div class="content">' + renderContent(r.content) + '</div>' +
      '</div>'
    ).join("") : "<p>No replies yet.</p>");

  const { data: auth } = await supabaseClient.auth.getUser();

  if (auth.user) {
    replyBox.innerHTML =
      '<h2>Reply</h2>' +
      '<form id="replyForm">' +
      '<textarea id="replyContent" required placeholder="Write your reply..."></textarea><br><br>' +
      '<button type="submit">Post Reply</button>' +
      '</form>';

    document.getElementById("replyForm").addEventListener("submit", async e => {
      e.preventDefault();
      message.textContent = "Posting...";

      const content = document.getElementById("replyContent").value.trim();

      const { error } = await supabaseClient.from("replies").insert({
        thread_id: Number(threadId),
        author_id: auth.user.id,
        content: content
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      window.location.reload();
    });
  } else {
    replyBox.innerHTML =
      '<p><a href="login.html">Login</a> or <a href="register.html">Register</a> to reply.</p>';
  }
}

load();
</script>
</body>
</html>
